<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda Laine - Loja Online</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .produto-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .imagem-container {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #eee;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .imagem-container img.principal {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .fotos-miniaturas {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            overflow-x: auto;
        }
        .miniatura {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .miniatura:hover {
            border-color: #2c3e50;
        }
        .produto-card h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #333;
        }
        .preco {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 15px;
        }
        button {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1ebe5d;
        }
        .sem-produtos {
            text-align: center;
            grid-column: 1 / -1;
            color: #777;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Moda Laine</h1>
    <div id="lista-produtos" class="grid-produtos">
        <!-- Os produtos serão carregados aqui automaticamente -->
    </div>
</div>

<script>
    // Substitua pelas suas credenciais do Supabase se necessário
    const SUPABASE_URL = 'https://emsziewivstdmlwortmu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Vpo0ewgWELFBLTUrXaobIw_SWz6cgSF';
    
    // Se estiver a usar o cliente global ou local configurado:
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    async function buscarProdutos() {
        const lista = document.getElementById('lista-produtos');
        
        try {
            // Se estiver a usar o Supabase diretamente:
            if (supabaseClient) {
                const { data, error } = await supabaseClient.from('produtos').select('*');
                if (error) throw error;
                renderizarProdutos(data);
            } else {
                // Modo de segurança local caso prefira testar
                lista.innerHTML = '<p class="sem-produtos">Carregando produtos...</p>';
            }
        } catch (err) {
            console.error('Erro ao buscar produtos:', err);
            lista.innerHTML = '<p class="sem-produtos">Erro ao carregar os produtos.</p>';
        }
    }

    function renderizarProdutos(produtos) {
        const lista = document.getElementById('lista-produtos');
        lista.innerHTML = '';

        if (!produtos || produtos.length === 0) {
            lista.innerHTML = '<p class="sem-produtos">Nenhum produto cadastrado no momento.</p>';
            return;
        }

        produtos.forEach(produto => {
            const fotoPrincipal = produto.imagem_url || 'https://via.placeholder.com/300';
            
            let fotosExtrasHTML = '';
            // Verifica se existem fotos extras cadastradas
            let listaFotos = produto.fotos_extras;
            if (typeof listaFotos === 'string') {
                try { listaFotos = JSON.parse(listaFotos); } catch(e) { listaFotos = []; }
            }

            if (listaFotos && listaFotos.length > 0) {
                fotosExtrasHTML = '<div class="fotos-miniaturas">';
                listaFotos.forEach(foto => {
                    fotosExtrasHTML += `<img src="${foto}" class="miniatura" onclick="trocarFotoPrincipal(this, '${produto.id}')">`;
                });
                fotosExtrasHTML += '</div>';
            }

            const card = document.createElement('div');
            card.className = 'produto-card';
            card.innerHTML = `
                <div>
                    <div class="imagem-container">
                        <img id="foto-principal-${produto.id}" class="principal" src="${fotoPrincipal}" alt="${produto.nome}">
                    </div>
                    <h3>${produto.nome}</h3>
                    <p class="preco">R$ ${parseFloat(produto.preco || 0).toFixed(2)}</p>
                    ${fotosExtrasHTML}
                </div>
                <button onclick="comprarWhatsApp('${produto.nome}')">Pedir no WhatsApp</button>
            `;

            lista.appendChild(card);
        });
    }

    function trocarFotoPrincipal(elemento, produtoId) {
        const fotoPrincipal = document.getElementById(`foto-principal-${produtoId}`);
        if (fotoPrincipal) {
            fotoPrincipal.src = elemento.src;
        }
    }

    function comprarWhatsApp(nomeProduto) {
        const telefone = "554999663759"; // Substitua pelo seu número do WhatsApp com DDD
        const mensagem = encodeURIComponent(`Olá! Gostaria de comprar o produto: ${nomeProduto}`);
        window.open(`https://wa.me/${telefone}?text=${mensagem}`, '_blank');
    }

    // Carregar produtos ao iniciar a página
    window.onload = buscarProdutos;
</script>

</body>
</html>
